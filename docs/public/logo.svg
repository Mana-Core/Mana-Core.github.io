<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="800" viewBox="0 0 800 800" fill="none" role="img" aria-labelledby="title description">
<title id="title">Mana Core — Refracted Heart</title>
<desc id="description">A faceted sapphire mana orb with a single luminous cyan mana flame, refracted separately through its crystal faces, white energy ribbons, manga ink outlines, and a soft floating shadow against the original pale lavender background. Refraction is static vector artwork derived from Snell's law at refractive index 1.46.</desc>
